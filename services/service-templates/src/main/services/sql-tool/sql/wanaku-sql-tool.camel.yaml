- route:
    id: sql-tool
    from:
      uri: ai-tool:sql
      parameters:
        tags: wanaku
        description: "Search on a database using a predefined query"
        parameter.query: string
        parameter.query.description: "Input argument for the query"
      steps:
        # The tool input (query) arrives as a header and is bound by camel-sql as a
        # prepared-statement parameter (:#wanakuBody). Keep sql.query a fixed, predefined
        # statement and reference the input via :#wanakuBody.
        - setHeader:
            name: wanakuBody
            expression:
              simple:
                expression: ${header.query}
        - setHeader:
            name: CamelSqlQuery
            expression:
              simple:
                expression: "{{sql.query}}"
        - to:
            uri: sql
            parameters:
              dataSource: "#dataSource"
              query: ${header.CamelSqlQuery}
        - convertBodyTo:
            type: "java.lang.String"
