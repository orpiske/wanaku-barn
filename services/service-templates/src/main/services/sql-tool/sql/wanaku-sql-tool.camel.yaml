- route:
    id: sql-tool
    from:
      uri: ai-tool:sql
      parameters:
        tags: sql
        description: "Search on a database using a predefined query"
        parameter.wanaku_body: string
        parameter.wanaku_body.description: "Input argument for the query"
      steps:
        - setHeader:
            name: wanakuBody
            expression:
              simple:
                expression: ${body}
        - setHeader:
            name: CamelSqlQuery
            expression:
              simple:
                expression: "{{sql.query}}"
        - to:
            uri: sql
            parameters:
              dataSource: "#dataSource"
              query: ${header.CamelSqlQuery}
        - convertBodyTo:
            type: "java.lang.String"
