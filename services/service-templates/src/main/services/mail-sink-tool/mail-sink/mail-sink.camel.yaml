- route:
    id: mail-send
    from:
      uri: ai-tool:mail-send
      parameters:
        tags: mail
        description: "{{tool.description}}"
        parameter.wanaku_body: string
        parameter.wanaku_body.description: "The email body content"
      steps:
        - to:
            uri: smtp:{{smtp.host}}:{{smtp.port}}
            parameters:
              username: "{{smtp.username}}"
              password: "{{smtp.password}}"
              to: "{{mail.to}}"
              from: "{{mail.from}}"
              subject: "{{mail.subject}}"
