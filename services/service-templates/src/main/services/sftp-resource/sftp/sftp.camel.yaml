- route:
    id: sftp-read
    from:
      uri: ai-tool:sftp-read
      parameters:
        tags: wanaku
        description: "{{tool.description}}"
        parameter.fileName: string
        parameter.fileName.description: "The name of the file on the SFTP server"
        parameter.fileName.required: true
      steps:
        - setHeader:
            name: CamelFileName
            expression:
              simple:
                expression: "${header.fileName}"
        - choice:
            when:
              - simple: "{{sftp.authMethod}} == 'key'"
                steps:
                  - to:
                      uri: sftp:{{sftp.username}}@{{sftp.host}}:{{sftp.port}}/{{sftp.directory}}
                      parameters:
                        privateKeyFile: "{{sftp.privateKeyFile}}"
                        knownHostsFile: "{{sftp.knownHostsFile}}"
                        strictHostKeyChecking: "{{sftp.strictHostKeyChecking}}"
                        disconnect: "{{sftp.disconnect}}"
                        soTimeout: "{{sftp.soTimeout}}"
                        timeout: "{{sftp.timeout}}"
            otherwise:
              steps:
                  - to:
                      uri: sftp:{{sftp.username}}@{{sftp.host}}:{{sftp.port}}/{{sftp.directory}}
                      parameters:
                        password: "{{sftp.password}}"
                        knownHostsFile: "{{sftp.knownHostsFile}}"
                        strictHostKeyChecking: "{{sftp.strictHostKeyChecking}}"
                        disconnect: "{{sftp.disconnect}}"
                        soTimeout: "{{sftp.soTimeout}}"
                        timeout: "{{sftp.timeout}}"
