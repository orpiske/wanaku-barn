- route:
    id: s3-read-object
    from:
      uri: ai-tool:s3-read-object
      parameters:
        tags: wanaku
        description: "{{tool.description}}"
        parameter.objectKey: string
        parameter.objectKey.description: "The key of the object to read from the S3 bucket"
        parameter.objectKey.required: true
        readOnlyHint: true
      steps:
        - setHeader:
            name: CamelAwsS3BucketName
            simple: "{{aws.s3.bucketName}}"
        - setHeader:
            name: CamelAwsS3Key
            simple: "${header.objectKey}"
        - to:
            uri: aws2-s3:{{aws.s3.bucketName}}
            parameters:
              region: "{{aws.s3.region}}"
              accessKey: "{{aws.s3.accessKey}}"
              secretKey: "{{aws.s3.secretKey}}"
              operation: getObject
