- route:
    id: tavily-search
    from:
      uri: ai-tool:tavily-search
      parameters:
        tags: search
        description: "Search the web using the Tavily AI-optimized search engine"
        parameter.wanaku_body: string
        parameter.wanaku_body.description: "The search term"
      steps:
        - to:
            uri: langchain4j-web-search:wanakuTavily
            parameters:
              webSearchEngine: "#web-search-engine"
              resultType: SNIPPET
              maxResults: "{{max.results}}"
