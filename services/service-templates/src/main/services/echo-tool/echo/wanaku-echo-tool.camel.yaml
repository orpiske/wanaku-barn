- route:
    id: echo-tool
    from:
      uri: ai-tool:echo
      parameters:
        tags: echo
        description: "Echo back the input message duplicated with a separator"
        parameter.wanaku_body: string
        parameter.wanaku_body.description: "The message to echo back"
      steps:
        - setBody:
            expression:
              simple:
                expression: "${body}{{echo.separator}}${body}"
