- route:
    id: jira-update-issue
    from:
      uri: ai-tool:jira-update-issue
      parameters:
        tags: wanaku
        description: "{{tool.description}}"
        parameter.fields: string
        parameter.fields.description: "The issue fields to update"
      steps:
        - to:
            uri: jira:updateIssue
            parameters:
              jiraUrl: "{{jira.url}}"
              accessToken: "{{jira.access.token}}"
