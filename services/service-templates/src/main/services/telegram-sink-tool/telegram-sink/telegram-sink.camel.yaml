- route:
    id: telegram-send
    from:
      uri: ai-tool:telegram-send-message
      parameters:
        tags: wanaku
        description: "{{tool.description}}"
        parameter.message: string
        parameter.message.description: "The message text to send via Telegram"
      steps:
        - to:
            uri: telegram:bots
            parameters:
              authorizationToken: "{{telegram.auth.token}}"
              chatId: "{{telegram.chat.id}}"
