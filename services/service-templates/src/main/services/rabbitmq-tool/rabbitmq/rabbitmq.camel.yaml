- route:
    id: rabbitmq-send
    from:
      uri: ai-tool:send-message-to-rabbitmq
      parameters:
        tags: rabbitmq
        description: "Send a message to RabbitMQ"
        parameter.wanaku_body: string
        parameter.wanaku_body.description: "The message to send to RabbitMQ"
      steps:
        - log: ${body}
        - to:
            uri: spring-rabbitmq
            parameters:
              queues: "{{rabbitmq.queue}}"
              exchangeName: "{{rabbitmq.exchange}}"
              connectionFactory: "#rabbitConnectionFactory"
