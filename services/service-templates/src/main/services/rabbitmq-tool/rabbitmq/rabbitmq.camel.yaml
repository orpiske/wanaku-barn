- route:
    id: rabbitmq-send
    from:
      uri: ai-tool:send-message-to-rabbitmq
      parameters:
        tags: wanaku
        description: "Send a message to RabbitMQ"
        parameter.message: string
        parameter.message.description: "The message to send to RabbitMQ"
      steps:
        - log: ${header.message}
        - to:
            uri: spring-rabbitmq
            parameters:
              queues: "{{rabbitmq.queue}}"
              exchangeName: "{{rabbitmq.exchange}}"
              connectionFactory: "#rabbitConnectionFactory"
