- route:
    id: azure-files-read
    from:
      uri: ai-tool:azure-files-read
      parameters:
        tags: wanaku
        description: "{{tool.description}}"
        parameter.fileName: string
        parameter.fileName.description: "The name of the file in the Azure Storage file share"
        parameter.fileName.required: true
      steps:
      - setHeader:
          name: CamelFileName
          expression:
            simple:
              expression: "${header.fileName}"
      - to:
          uri: azure-files:{{azure.files.account}}/{{azure.files.share}}
          parameters:
            credentialType: SHARED_ACCOUNT_KEY
            sharedKey: "{{azure.files.sharedKey}}"
