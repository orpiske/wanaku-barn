- route:
    id: jira-add-issue
    from:
      uri: ai-tool:jira-add-issue
      parameters:
        tags: jira
        description: "{{tool.description}}"
        parameter.wanaku_body: string
        parameter.wanaku_body.description: "The issue summary and description"
      steps:
        - to:
            uri: jira:addIssue
            parameters:
              jiraUrl: "{{jira.url}}"
              accessToken: "{{jira.access.token}}"
              projectKey: "{{jira.project.key}}"
              issueTypeName: "{{jira.issue.type}}"
