- route:
    id: jira-add-comment
    from:
      uri: ai-tool:jira-add-comment
      parameters:
        tags: jira
        description: "{{tool.description}}"
        parameter.wanaku_body: string
        parameter.wanaku_body.description: "The comment text to add to the issue"
      steps:
        - to:
            uri: jira:addComment
            parameters:
              jiraUrl: "{{jira.url}}"
              accessToken: "{{jira.access.token}}"
