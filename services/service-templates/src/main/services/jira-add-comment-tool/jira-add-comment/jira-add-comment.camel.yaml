- route:
    id: jira-add-comment
    from:
      uri: ai-tool:jira-add-comment
      parameters:
        tags: wanaku
        description: "{{tool.description}}"
        parameter.comment: string
        parameter.comment.description: "The comment text to add to the issue"
      steps:
        - to:
            uri: jira:addComment
            parameters:
              jiraUrl: "{{jira.url}}"
              accessToken: "{{jira.access.token}}"
