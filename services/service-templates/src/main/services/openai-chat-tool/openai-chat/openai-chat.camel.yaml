- route:
    id: openai-chat-completion
    from:
      uri: ai-tool:openai-chat-completion
      parameters:
        tags: wanaku
        description: "{{tool.description}}"
        parameter.prompt: string
        parameter.prompt.description: "The prompt text to send to OpenAI for chat completion"
        parameter.systemMessage: string
        parameter.systemMessage.description: "Optional system message to set the behavior of the assistant"
        parameter.model: string
        parameter.model.description: "Override the default OpenAI model (e.g., gpt-4, gpt-3.5-turbo)"
        parameter.temperature: number
        parameter.temperature.description: "Sampling temperature (0.0 to 2.0)"
        parameter.maxTokens: integer
        parameter.maxTokens.description: "Maximum number of tokens to generate"
      steps:
        - setHeader:
            name: CamelOpenAI.operation
            constant: "{{openai.operation}}"
        - setHeader:
            name: CamelOpenAI.model
            constant: "{{openai.model}}"
        - setHeader:
            name: CamelOpenAI.temperature
            constant: "{{openai.temperature}}"
        - setHeader:
            name: CamelOpenAI.maxTokens
            constant: "{{openai.max.tokens}}"
        - setHeader:
            name: CamelOpenAI.topP
            constant: "{{openai.top.p}}"
        - setHeader:
            name: CamelOpenAI.frequencyPenalty
            constant: "{{openai.frequency.penalty}}"
        - setHeader:
            name: CamelOpenAI.presencePenalty
            constant: "{{openai.presence.penalty}}"
        - choice:
            when:
              - simple: "${header.CamelOpenAI.systemMessage} != ''"
                steps:
                  - setHeader:
                      name: CamelOpenAI.messages
                      simple: '[{"role": "system", "content": "{{openai.system.message}}"}, {"role": "user", "content": "${header.prompt}"}]'
            otherwise:
              steps:
                - setHeader:
                    name: CamelOpenAI.messages
                    simple: '[{"role": "user", "content": "${header.prompt}"}]'
        - choice:
            when:
              - simple: "${header.CamelOpenAI.stopSequences} != ''"
                steps:
                  - setHeader:
                      name: CamelOpenAI.stop
                      simple: "${header.CamelOpenAI.stopSequences}"
            otherwise:
              steps:
                - setHeader:
                    name: CamelOpenAI.stop
                    simple: "{{openai.stop.sequences}}"
        - to:
            uri: "openai:chat-completion"
            parameters:
              apiKey: "{{openai.api.key}}"
