- route:
    id: route-3543
    from:
      uri: ai-tool:send-message-using-jms
      parameters:
        tags: wanaku
        description: "Send messages using JMS"
        parameter.message: string
        parameter.message.description: "The message to send using JMS"
      steps:
        - log: ${header.message}
        - to:
            id: to-2964
            uri: jms
            parameters:
              destinationType: queue
              destinationName: "{{request.queue}}"
              replyTo: "{{response.queue}}"
              connectionFactory: "#connectionFactory"
