apiVersion: "wanaku.ai/v1alpha1"
kind: WanakuRouter
metadata:
  name: wanaku-dev
spec:
# Global image pull policy for all deployments
# Valid values: Always, IfNotPresent, Never
# Default: IfNotPresent
#  imagePullPolicy: IfNotPresent
# Exposure configuration for external access
# OpenShift clusters auto-generate the host via Routes
# Kubernetes requires explicit host configuration via Ingress
#  exposure:
#    type: Ingress
#    host: wanaku.example.com
# Wanaku Server settings (Rust MCP engine) - always deployed
  server: {}
#    image: quay.io/wanaku/wanaku-server:latest
#    imagePullPolicy: IfNotPresent
#    env:
#      - name: WANAKU_INFERENCE_UPSTREAM
#        value: "http://ollama:11434"
# Barn-backend settings (optional, for service catalog persistence)
# Set router.enabled: true to deploy barn-backend alongside Wanaku Server
#  router:
#    enabled: true
#    image: quay.io/wanaku/wanaku-barn-backend:latest
#    imagePullPolicy: IfNotPresent
