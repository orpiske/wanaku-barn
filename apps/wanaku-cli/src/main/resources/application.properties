quarkus.banner.enabled = false
quarkus.devservices.enabled = false

wanaku.cli.components.wanaku-barn-backend=https://github.com/wanaku-ai/wanaku-barn/releases/download/%s/wanaku-barn-backend-%s.zip
wanaku.cli.components.service-exec=https://github.com/wanaku-ai/wanaku-barn/releases/download/%s/wanaku-tool-service-exec-%s.zip
wanaku.cli.components.service-http=https://github.com/wanaku-ai/wanaku-barn/releases/download/%s/wanaku-tool-service-http-%s.zip
wanaku.cli.components.service-tavily=https://github.com/wanaku-ai/wanaku-barn/releases/download/%s/wanaku-tool-service-tavily-%s.zip
wanaku.cli.components.camel-integration=https://github.com/wanaku-ai/camel-integration-capability/releases/download/%s/camel-integration-capability-main-%s-jar-with-dependencies.jar
wanaku.cli.default-services=provider-file,service-http

# Authentication Configuration
wanaku.cli.auth.enabled=false
wanaku.cli.auth.mode=none
wanaku.cli.auth.credentials-file=~/.wanaku/credentials

#quarkus.native.resources.includes=nano/**

# Include documentation files in native image
quarkus.native.resources.includes=docs/**

quarkus.log.level=WARNING
quarkus.log.category."ai.wanaku".level=INFO
quarkus.log.category."ai.wanaku.capabilities.sdk.common.ProcessRunner".level=WARNING
quarkus.log.category."org.jline".level=ERROR
%dev.quarkus.log.category."ai.wanaku".level=INFO
%test.quarkus.log.category."ai.wanaku".level=INFO
