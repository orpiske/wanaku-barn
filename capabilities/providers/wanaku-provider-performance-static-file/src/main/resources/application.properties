# HTTP Server Configuration
quarkus.http.host-enabled=true
quarkus.http.port=9001
quarkus.http.host=0.0.0.0

quarkus.banner.enabled = false
quarkus.devservices.enabled = false

quarkus.log.level=WARNING
quarkus.log.category."ai.wanaku".level=INFO

%dev.quarkus.log.console.enabled=false
%dev.quarkus.log.handler.file.service-log.enabled=true
%dev.quarkus.log.handler.file.service-log.path=target/provider-service.log
%dev.quarkus.log.handler.file.service-log.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c] (%t) %s%e%n
%dev.quarkus.log.category."ai.wanaku".handlers=service-log
%dev.quarkus.log.category."ai.wanaku".level=DEBUG
%dev.quarkus.log.category."io.quarkus".handlers=service-log
%dev.quarkus.log.category."io.quarkus".level=INFO


wanaku.service.name=performancestaticfile
wanaku.service.base-uri=performancestaticfile://
wanaku.service.performance.delay=100

# The service may have user-exposable parameters that can be set via CLI. The
# example below is exposed as "noop" with the description
# "Whether to do nothing or do something".
# wanaku.service.service.configurations.noop="Whether to do nothing or do something"

# Additionally, those parameters may also have default values, in case they are
# not set by the user
# wanaku.service.service.defaults.noop=true

# Registration settings
#wanaku.service.registration.uri=http://localhost:8080
#wanaku.service.registration.interval=10s
#wanaku.service.registration.retries=3
#wanaku.service.registration.retry-wait-seconds=1
#wanaku.service.registration.delay-seconds=3
#wanaku.service.registration.announce-address=my-custom-addr

# Auth settings are inherited from wanaku-capabilities-base.
# Override auth.server, quarkus.oidc-client.client-id, or
# quarkus.oidc-client.credentials.secret here if needed.
